{% comment %}
  Ad styling, shared by base.html and the standalone landing template
  (nekotab_home.html has its own <head>, so it can't inherit base.html's).

  Include inside <head>, guarded by the caller's {% if ads_enabled %}.
{% endcomment %}
<style>
  .nekotab-ad{margin:1rem 0;overflow:hidden;text-align:center;min-height:50px}
  .nekotab-ad--top{margin:.5rem 0 1.25rem}
  .nekotab-ad--footer{margin:1.5rem 0 .5rem}
  .nekotab-ad--sidebar{margin:12px 0}
  /* Full-bleed landing sections need the unit reined in and centred. */
  .nekotab-ad--home{max-width:970px;margin-left:auto;margin-right:auto;padding:0 16px}
  .nekotab-ad__remove,.nekotab-anchor__remove{display:inline-block;margin-top:4px;
    font-size:11px;line-height:1.4;color:#6b7280;text-decoration:underline;opacity:.85}
  .nekotab-ad__remove:hover,.nekotab-anchor__remove:hover{color:#6366f1}
  .nekotab-anchor{position:fixed;left:0;right:0;bottom:0;z-index:9990;
    background:rgba(255,255,255,.97);border-top:1px solid #e5e7eb;
    box-shadow:0 -1px 6px rgba(0,0,0,.08);text-align:center;padding:2px 0 4px;
    max-height:130px;overflow:hidden}
  .nekotab-anchor[hidden]{display:none}
  .nekotab-anchor__close{position:absolute;top:-11px;right:8px;width:22px;height:22px;
    padding:0;line-height:20px;font-size:16px;border:1px solid #e5e7eb;border-radius:50%;
    background:#fff;color:#6b7280;cursor:pointer;z-index:1}
  /* Constrains the notice on the full-bleed landing page. */
  .nk-home-notice-wrap{max-width:970px;margin:0 auto;padding:0 16px}
  /* Ad-block notice. Class names deliberately contain no "ad"/"banner"/
     "sponsor" substring, or filter lists would hide this too. */
  .nk-support-note{display:flex;flex-wrap:wrap;align-items:center;gap:10px;
    position:relative;margin:0 0 1rem;padding:12px 40px 12px 14px;
    border:1px solid #fde68a;border-radius:10px;background:#fffbeb;
    color:#92400e;font-size:.875rem;line-height:1.45}
  .nk-support-note[hidden]{display:none}
  .nk-support-note__text{flex:1 1 240px;min-width:0}
  .nk-support-note__cta{flex:0 0 auto;padding:7px 14px;border-radius:7px;
    background:#6366f1;color:#fff !important;font-weight:600;font-size:.8125rem;
    text-decoration:none !important;white-space:nowrap}
  .nk-support-note__cta:hover{background:#4f46e5}
  .nk-support-note__x{position:absolute;top:6px;right:8px;width:24px;height:24px;
    padding:0;line-height:22px;font-size:17px;border:0;border-radius:50%;
    background:transparent;color:#b45309;cursor:pointer}
  .nk-support-note__x:hover{background:rgba(180,83,9,.12)}
  @media print{.nk-support-note{display:none !important}}

  /* Ad-removal offer card on the tournament admin overview. Mobile-first:
     stacks by default, becomes a single row from 576px up. */
  .nk-adfree-card{position:relative;display:flex;flex-direction:column;gap:14px;
    margin:0 0 1.25rem;padding:20px 44px 20px 20px;border-radius:14px;
    background:linear-gradient(135deg,#eef2ff 0%,#f5f3ff 55%,#fdf4ff 100%);
    border:1px solid #c7d2fe;box-shadow:0 1px 3px rgba(79,70,229,.10)}
  .nk-adfree-card[hidden]{display:none}
  .nk-adfree-card__icon{flex:0 0 auto;display:inline-flex;align-items:center;
    justify-content:center;width:42px;height:42px;border-radius:11px;
    background:#6366f1;color:#fff;box-shadow:0 2px 6px rgba(99,102,241,.35)}
  .nk-adfree-card__icon svg{width:22px;height:22px}
  .nk-adfree-card__body{flex:1 1 auto;min-width:0}
  .nk-adfree-card__title{margin:0 0 4px;font-size:1.0625rem;font-weight:700;
    line-height:1.3;color:#1e1b4b}
  .nk-adfree-card__text{margin:0;font-size:.875rem;line-height:1.5;color:#4c4b7a}
  .nk-adfree-card__cta{flex:0 0 auto;align-self:flex-start;display:inline-block;
    padding:11px 22px;border-radius:9px;background:#6366f1;color:#fff !important;
    font-weight:600;font-size:.9375rem;text-decoration:none !important;
    white-space:nowrap;box-shadow:0 2px 6px rgba(99,102,241,.35);
    transition:background .15s,transform .15s}
  .nk-adfree-card__cta:hover{background:#4f46e5;transform:translateY(-1px)}
  .nk-adfree-card__x{position:absolute;top:8px;right:10px;width:26px;height:26px;
    padding:0;line-height:24px;font-size:19px;border:0;border-radius:50%;
    background:transparent;color:#8b8aa8;cursor:pointer}
  .nk-adfree-card__x:hover{background:rgba(99,102,241,.12);color:#4338ca}
  @media (min-width:576px){
    .nk-adfree-card{flex-direction:row;align-items:center;gap:18px}
    .nk-adfree-card__cta{align-self:auto}
  }
  @media print{.nk-adfree-card{display:none !important}}

  /* Ad-free offer in the admin sidebar. Not an ad — /admin/ serves none. */
  .nk-adfree-promo{border-left:3px solid #6366f1 !important;background:#eef2ff !important}
  .nk-adfree-promo span{font-weight:600}
  .nk-adfree-promo small{font-size:11px;line-height:1.3;margin-top:2px}
  .nk-adfree-promo:hover{background:#e0e7ff !important}
  @media print{.nekotab-ad,.nekotab-anchor,.nk-adfree-promo{display:none !important}}
</style>
